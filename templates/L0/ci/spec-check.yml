# 模板：拷到规格库的 .github/workflows/spec-check.yml
#
# 前提：规格库自身已签入 checker、bundle generator、config、package.json 与 lockfile。
# package scripts 至少包含 check / fix:generated-regions / generate:bundle。
#
# 为什么必须挂 CI（不能靠人手跑）：手跑的报告在活库上一写完就过期 —— 只要底下有文件再动一下，
# 计数就变了，保存的报告却还是旧的。闸门必须在每次 push / PR 上对着当时的树跑，才有意义。
#
# 消费仓库（放代码的仓库）另跑 verify-consumer-contracts.mjs，比对签入副本。
# 不要让本库的生成脚本直接写到相邻仓库 —— 那样两边 CI 都跑不到这个比对。见 SKILL.md §2。

name: spec-suite 检查

on:
  push:
    paths:
      - 'contracts/**'
      - 'decisions/**'
      - '10-why/**'
      - '.spec-suite/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'generated/**'
      - 'scripts/**'
      - 'spec-suite.config.json'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只需要 yaml 这一个依赖；有 lockfile 就用 npm ci，否则装 yaml
      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i yaml@^2; fi

      # 两种派生职责分别执行，再统一要求工作树无 diff。
      - name: 派生产物是否最新
        run: |
          npm run fix:generated-regions
          npm run generate:bundle
          if ! git diff --quiet; then
            echo "::error::adapter 生成区或 generated bundle 不是 canonical inputs 的当前投影"
            git --no-pager diff --stat
            exit 1
          fi

      # checker 保持只读语义；有 error 级发现时退出 1。
      - name: 一致性检查
        run: npm run check

      # checker 自己的单测（若把测试也拷进了规格库）
      - name: 单元测试
        run: npm test --if-present
