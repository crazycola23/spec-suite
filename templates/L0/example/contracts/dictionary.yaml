# contracts/dictionary.yaml —— 最小 L0 示例（已填好，非模板占位）
#
# 这份是枚举、状态机、规则缺口的权威来源。每条业务事实都带 source，
# 指向 10-why/02-业务规则.md 里真实存在的 BR-* 标题。

meta:
  suite: example
  truthSource: 10-why/02-业务规则.md

enums:
  - code: MemberStatus
    label: 成员状态
    source: BR-MEMBER-001
    values:
      - code: active
        label: 生效
        source: BR-MEMBER-001
      - code: removed
        label: 已移除
        source: BR-MEMBER-002

stateMachines:
  - code: Invitation
    label: 邀请
    source: BR-MEMBER-003
    states:
      - code: pending
        label: 待接受
        source: BR-MEMBER-003
        terminal: false
        transitions:
          - to: accepted
            trigger: accept
            source: BR-MEMBER-004
      - code: accepted
        label: 已接受
        source: BR-MEMBER-003
        terminal: true
        transitions: []

gaps:
  - code: G-01
    missing: 邀请多少天后失效
    blocks: [contracts/ddl]
    protectiveDefault: 不自动过期，列表里标记为陈旧，由人工撤销
    rollbackCost: 加一个过期任务即可；不回填历史邀请，可逆
    owner: 产品
    status: open
    closedBy: null
    closedAt: null
    provenance:
      schemaVersion: 1
      unresolvedFact: invitation_expiry_days
      sourceSearch: [docs, code]
      evidence: []
      blockedAction: do_not_implement_default
      nextEvidence: product_owner
