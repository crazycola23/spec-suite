# 模板：进入契约层（工作流 E）时拷入，放 contracts/ 目录。与层数无关 —— L0 的小库要写 API 时同样拷。
# 纪律注释直接写在 info.description 里，它会被工具和人反复读到：
#   枚举 / 错误码 / 权限码一律引用字典 yaml，本文件不重复定义值；
#   描述里只写 ID，不复制中文规则原文（N-03/N-04）。
openapi: 3.0.3
info:
  title: <项目代号> API
  version: "<1.0.0>"
  description: |
    抽自 <真相源 / 技术设计 §N>。

    ## 纪律
    - 枚举值一律引用 <字典>.yaml，本文件不重复定义（N-01）
    - 错误码一律引用 <errors.yaml>（N-02）
    - 每个写操作声明 x-permission（来自 <permissions.yaml>，N-03）
    - 信封 / 分页 / 幂等 / 乐观锁见 <conventions.md>
    - 描述里只写 ID，不复制中文规则原文（N-04）
  x-ruleVersion: "<BR vX.Y>"
  x-contractVersion: "1.0"

servers:
  - url: <</api>>
    description: <经网关转发（网关移除前缀）>

tags:
  - { name: <module>, description: "<真相源 §N> <模块名>：<主对象>" }

security:
  - <AuthScheme>: []

paths:

  # ── <模块> ────────────────────────────────────────────
  /<resources>:
    get:
      tags: [<module>]
      summary: <资源>列表（S<nn>）
      description: <BR-XXX-001> <一句话，只写 ID 语义>
      x-permission: <perm:code>
      x-screen: S<nn>
      parameters:
        - { name: <page>, in: query, schema: { type: integer }, description: 分页见 conventions }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [<module>]
      summary: 创建<资源>（M<nn>）
      description: |
        typed body。成功创建的 <资源> 一律由服务端置为 <初始状态>；
        客户端不得提交 status、version、<编号 / 时间> 等服务端派生字段。
      x-permission: <perm:code>
      x-idempotencyKey: "required: X-Idempotency-Key；<重放语义>"
      requestBody: { $ref: "#/components/requestBodies/<Resource>Create" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /<resources>/{id}/<action>:
    post:
      tags: [<module>]
      summary: <状态迁移动作>
      description: |
        只提交 version + <动作参数>；目标状态由服务端按状态机校验。
        <未知态 / 超时> 不提供本入口，只提供查单（<BR-XXX-00n>）。
      x-permission: <perm:code>
      x-idempotencyKey: "required"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/<Resource>Transition" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Conflict" }

  # 不提供的接口也是契约 —— 写明"为什么不提供"，防止后来的人"补全"：
  # /<resources>/{id}:
  #   delete:
  #     x-intentionallyAbsent: "<BR-XXX-00n>：该对象只许追加，删除走 <独立动作>"

components:
  securitySchemes:
    <AuthScheme>: { type: apiKey, in: header, name: <Authorization> }

  parameters:
    IdempotencyKey:
      { name: X-Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    <Resource>Create:
      required: true
      description: "M<nn> typed body；<一句话语义>"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/<Resource>Create" }

  responses:
    Ok:
      description: 成功（信封见 conventions）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/<Envelope>" }
    Forbidden:
      description: 无权限（<ERR-XXXXX>）
    Conflict:
      description: 业务冲突 / 乐观锁版本冲突（<ERR-XXXXX>，details 含 changedFields）
    ValidationError:
      description: 前置项缺失（<ERR-XXXXX>，details 定位字段）

  schemas:
    <Envelope>:
      type: object
      description: 统一信封：code / message / requestId / data / warnings[]
    <Resource>Create:
      type: object
      additionalProperties: false
      description: |
        <创建体语义。列明服务端派生字段"客户端不得提交"——
        forbiddenRequestFields 在 fixtures 里逐一断言。>
      required: [<field>]
      properties:
        <field>: { type: string, description: <语义，引用 BR ID> }
    <Resource>Transition:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, description: 乐观锁 CAS }
        <reason>: { type: string, description: "<1~N 字符>" }
